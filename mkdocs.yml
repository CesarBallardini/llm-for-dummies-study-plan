site_name: LLM for Dummies
site_description: A self-study course from college algebra to building, training, operating and improving open-source LLMs.
# The user site CesarBallardini.github.io carries the custom domain
# katra.ballardini.com.ar, so this project site is served from that domain
# under the repository name. Keep the trailing slash: the canonical links,
# the sitemap and 404.html are all built from this value.
site_url: https://katra.ballardini.com.ar/llm-for-dummies-study-plan/
repo_url: https://github.com/CesarBallardini/llm-for-dummies-study-plan
repo_name: CesarBallardini/llm-for-dummies-study-plan

# Warnings are failures: a dangling reference or a page that moved should make
# the build go red, not rot silently in the book.
strict: true
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/karpathy
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com
    - icon: simple/huggingface
      link: https://huggingface.co

# Rendered verbatim in the footer of every page, chapters included, so the
# license notice does not have to be repeated in each chapter file. The link
# points at the repository so it resolves from the published site and GitHub alike.
copyright: >-
  Copyright &copy; 2026 Cesar Ballardini &mdash;
  <a href="https://github.com/CesarBallardini/llm-for-dummies-study-plan/blob/main/LICENSE">MIT License</a>.
  Linked third-party resources keep their own licenses.

nav:
  - Home: index.md
  - Part I - Mathematical Foundations:
      - Chapter 1 - College Algebra and Pre-calculus: chapter-01-college-algebra/index.md
      - Chapter 2 - Calculus I and II: chapter-02-calculus/index.md
      - Chapter 3 - Linear Algebra: chapter-03-linear-algebra/index.md
      - Chapter 4 - Probability and Statistics: chapter-04-probability-statistics/index.md
      - Chapter 5 - Optimization and Numerical Methods: chapter-05-optimization-numerical-methods/index.md
  - Part II - Programming and Tools:
      - Chapter 6 - Python and the Scientific Stack: chapter-06-python-scientific-stack/index.md
      - Chapter 7 - GPUs, Hardware and the Training Environment: chapter-07-gpus-hardware/index.md
  - Part III - Machine Learning and Deep Learning:
      - Chapter 8 - Machine Learning Foundations: chapter-08-machine-learning/index.md
      - "Chapter 9 - Deep Learning: Concepts and Practice": chapter-09-deep-learning/index.md
      - Chapter 10 - Neural Networks from Scratch: chapter-10-neural-networks-from-scratch/index.md
  - Part IV - Transformers and LLMs:
      - Chapter 11 - NLP Foundations and Word Representations: chapter-11-nlp-foundations/index.md
      - Chapter 12 - The Transformer Architecture: chapter-12-transformer-architecture/index.md
      - Chapter 13 - Tokens and Embeddings: chapter-13-tokenization-embeddings/index.md
      - Chapter 14 - Build an LLM from Scratch: chapter-14-llm-from-scratch/index.md
      - Chapter 15 - Pretraining at Scale: chapter-15-pretraining-at-scale/index.md
      - Chapter 16 - Distributed Training and Systems: chapter-16-distributed-training-systems/index.md
  - Part V - Post-Training:
      - Chapter 17 - Fine-Tuning and Parameter-Efficient Methods: chapter-17-finetuning/index.md
      - Chapter 18 - Alignment, RLHF and DPO: chapter-18-alignment-rlhf/index.md
      - Chapter 19 - Reasoning Models and Reinforcement Learning: chapter-19-reasoning-rl/index.md
  - Part VI - Evaluation, Deployment and the Ecosystem:
      - Chapter 20 - Evaluation and Benchmarks: chapter-20-evaluation-benchmarks/index.md
      - Chapter 21 - Inference Optimization and Serving: chapter-21-inference-serving/index.md
      - Chapter 22 - Operating and Improving an Open-Source LLM: chapter-22-operate-improve-open-llm/index.md
      - "Chapter 23 - Capstone: Train, Ship and Improve Your Own Model": chapter-23-capstone/index.md
      - Chapter 24 - The Research Reading Loop: chapter-24-research-reading-loop/index.md
  - License: license.md
